function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 코멘트(마크다운 유사 텍스트)를 HTML로 렌더링
function renderComment(text) {
  var lines = text.split("\n");
  var html = "";
  var listOpen = false, subOpen = false;
  function closeSub() { if (subOpen) { html += "</ul>"; subOpen = false; } }
  function closeList() { closeSub(); if (listOpen) { html += "</ul>"; listOpen = false; } }
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    var line = raw.replace(/\s+$/, "");
    if (line.trim() === "" || line.trim() === "---") continue;
    var h = line.match(/^\*\*(.+)\*\*$/);
    if (h) {
      closeList();
      html += "<h3>" + escapeHtml(h[1]) + "</h3>";
      continue;
    }
    var sub = raw.match(/^\s+·\s?(.*)$/);
    if (sub) {
      if (!listOpen) { html += "<ul>"; listOpen = true; }
      if (!subOpen) { html += "<ul>"; subOpen = true; }
      html += '<li class="sub">' + escapeHtml(sub[1]) + "</li>";
      continue;
    }
    var bullet = line.match(/^-\s(.*)$/);
    if (bullet) {
      closeSub();
      if (!listOpen) { html += "<ul>"; listOpen = true; }
      html += "<li>" + escapeHtml(bullet[1]) + "</li>";
      continue;
    }
    var indented = raw.match(/^\s+(\S.*)$/);
    if (indented && listOpen) {
      // 직전 항목에 이어지는 보조 설명
      if (subOpen) {
        html += '<li class="sub">' + escapeHtml(indented[1]) + "</li>";
      } else {
        html += "<li>" + escapeHtml(indented[1]) + "</li>";
      }
      continue;
    }
    closeList();
    html += "<p>" + escapeHtml(line.trim()) + "</p>";
  }
  closeList();
  return html;
}

function lookup() {
  var id = document.getElementById("sid").value.trim();
  var box = document.getElementById("result");
  if (id === "") {
    box.innerHTML = '<p class="error">학번을 입력하세요.</p>';
    return;
  }
  var rec = DATA[id];
  if (!rec) {
    box.innerHTML = '<p class="error">해당 학번(' + escapeHtml(id) + ')의 평가 정보를 찾을 수 없습니다. 학번을 다시 확인하세요.</p>';
    return;
  }
  var html = '<div class="meta">';
  html += "<div>이름: <b>" + escapeHtml(rec.name) + "</b></div>";
  html += "<div>학번: " + escapeHtml(id) + "</div>";
  if (rec.topic) html += "<div>연구 주제: " + escapeHtml(rec.topic) + "</div>";
  html += '<div class="score">평가 점수: ' + escapeHtml(rec.score) + "</div>";
  html += "</div>";
  html += "<h2>평가 내용</h2>";
  html += renderComment(rec.comment);
  box.innerHTML = html;
}

document.getElementById("btn").addEventListener("click", lookup);
document.getElementById("sid").addEventListener("keydown", function(e) {
  if (e.key === "Enter") lookup();
});
</script>
